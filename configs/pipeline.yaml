# Single source of truth for the HI-Small mule pipeline. Paths are relative to the repo root.
# Every value here is logged to MLflow with each run (see src/muledetect/pipeline.py).
seed: 42

paths:
  raw_csv: data/raw/ibm_aml/HI-Small_Trans.csv
  interim: data/interim/hi_small_trans.parquet        # ingest -> validate/features
  validation_report: reports/validation.json          # validate
  features_dir: data/processed                        # features -> features_{train,val,test}.parquet
  model: models/lgbm.joblib                           # train -> evaluate
  calibrator: models/calibrator.joblib                # train -> evaluate (Platt, fit on val)
  metrics: reports/metrics.json                       # evaluate
  report: reports/evaluation.md                       # evaluate
  pr_curve: reports/pr_curve.png                      # evaluate
  pr_curve_csv: reports/pr_curve_test.csv             # evaluate

split:                      # temporal, by row-count quantile of timestamp
  train_frac: 0.6
  val_frac: 0.2             # test = the remainder

features:
  behaviour: true           # Day-6 behaviour features on top of the core ones
  # Columns the model sees. Left out on purpose: fmt_out_reinvestment and self_transfers
  # only occur in the train window (train artefacts, see docs/day6_features.md).
  model_columns:
    - txns_out
    - txns_in
    - txns
    - amount_out
    - amount_in
    - cp_out
    - cp_in
    - counterparties
    - banks_out
    - banks_in
    - banks
    - avg_amount_out
    - avg_amount_in
    - max_amount_out
    - max_amount_in
    - in_out_ratio
    - amount_ratio
    - active_hours
    - txns_per_hour
    - active_span_hours
    - n_active_days
    - n_active_hours
    - txns_per_active_day
    - txns_per_active_hour
    - max_txns_in_hour
    - burst_ratio
    - gap_min_hours
    - gap_median_hours
    - in_out_amount_ratio
    - out_after_in_share
    - hold_median_hours
    - out_within_24h_share
    - fmt_out_ach
    - fmt_out_bitcoin
    - fmt_out_cash
    - fmt_out_cheque
    - fmt_out_credit_card
    - fmt_out_wire
    - cross_ccy_share
    - round_amount_share
    - fan_out_diversity
    - fan_in_diversity
    - fan_in_out_ratio
  target: is_mule

model:                      # LightGBM (sklearn API); seed is injected as random_state
  # Chosen on validation PR-AUC only. scale_pos_weight >= 5 collapsed to 1-13 trees on this temporal
  # split (train mules do not look like later mules); 2 keeps weighting without that collapse.
  params:
    n_estimators: 2000
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 500
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    scale_pos_weight: 2
    n_jobs: 4
  early_stopping_rounds: 100 # monitored on the val split (average precision)

evaluate:
  alert_budgets: [100, 500, 1000]   # accounts an investigation team can review per period

# Hand-written baseline standing in for the bank's rules engine. Each rule = ANDed `column >= value`.
# Thresholds were set from the train/val windows only. Accounts are ranked by #rules fired, then amount_out.
rules:
  tiebreak: amount_out
  definitions:
    high_passthrough_24h:   {out_within_24h_share: 0.5, txns_out: 3}
    many_counterparties:    {counterparties: 10}
    balanced_in_out:        {in_out_amount_ratio: 0.8, txns_in: 2, txns_out: 2}
    rapid_burst:            {max_txns_in_hour: 5}

mlflow:
  db: mlflow.db             # SQLite backend store in the repo root
  experiment: mule-detection
